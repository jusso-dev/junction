[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.11"
edition = "2024"
license = "MIT"
repository = "https://github.com/jusso-dev/junction"
rust-version = "1.89"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
clap = { version = "4", features = ["derive"] }

[patch.crates-io]
# Ratatui 0.29 pins unicode-width 0.2.0; YAML diagnostics require 0.2.2.
ratatui = { path = "vendor/ratatui" }
