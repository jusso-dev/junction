# Attack surface reduction (ASR) rules, from Microsoft Learn "Attack surface reduction rules reference"
# (https://learn.microsoft.com/defender-endpoint/attack-surface-reduction-rules-reference), checked
# 25-10-2026. GUIDs and advanced hunting action types are copied from that page.
#
# Fields:
#   guid            Rule GUID (Defender CSP, Group Policy and PowerShell configure rules by GUID).
#   name            Official rule name (Microsoft Intune name).
#   intune_setting  Settings catalog child setting under
#                   device_vendor_msft_policy_config_defender_attacksurfacereductionrules_. Values end
#                   in _off, _block, _audit or _warn.
#   intune_intent   Legacy endpoint security template / security baseline properties
#                   (windows10EndpointProtectionConfiguration in Graph beta) that set the rule.
#   hunting         Advanced hunting ActionType stem in DeviceEvents, without the Audited, Blocked or
#                   WarnBypassed suffix (absent when the rule raises no hunting events).
#   quick_win       Must be in block on Windows devices (endpoint.asr_quick_wins fails otherwise).
#   standard        One of Microsoft's "standard protection" rules, recommended in block for everyone.
#   servers_only    Only applies to Windows Server; not expected on workstations.
#   source          Section of the reference page for this rule.
reference: https://learn.microsoft.com/defender-endpoint/attack-surface-reduction-rules-reference
rules:
  - guid: 56a863a9-875e-4185-98a7-b882c64b5ce5
    name: Block abuse of exploited vulnerable signed drivers
    intune_setting: blockabuseofexploitedvulnerablesigneddrivers
    hunting: AsrVulnerableSignedDriver
    standard: true
    source: https://learn.microsoft.com/defender-endpoint/attack-surface-reduction-rules-reference#block-abuse-of-exploited-vulnerable-signed-drivers-device
  - guid: 7674ba52-37eb-4a4f-a9a1-f0f9a1619a2c
    name: Block Adobe Reader from creating child processes
    intune_setting: blockadobereaderfromcreatingchildprocesses
    intune_intent: [defenderAdobeReaderLaunchChildProcess]
    hunting: AsrAdobeReaderChildProcess
    source: https://learn.microsoft.com/defender-endpoint/attack-surface-reduction-rules-reference#block-adobe-reader-from-creating-child-processes
  - guid: d4f940ab-401b-4efc-aadc-ad5f3c50688a
    name: Block all Office applications from creating child processes
    intune_setting: blockallofficeapplicationsfromcreatingchildprocesses
    intune_intent: [defenderOfficeAppsLaunchChildProcessType, defenderOfficeAppsLaunchChildProcess]
    hunting: AsrOfficeChildProcess
    quick_win: true
    source: https://learn.microsoft.com/defender-endpoint/attack-surface-reduction-rules-reference#block-all-office-applications-from-creating-child-processes
  - guid: 9e6c4e1f-7d60-472f-ba1a-a39ef669e4b2
    name: Block credential stealing from the Windows local security authority subsystem
    intune_setting: blockcredentialstealingfromwindowslocalsecurityauthoritysubsystem
    intune_intent: [defenderPreventCredentialStealingType]
    hunting: AsrLsassCredentialTheft
    quick_win: true
    standard: true
    source: https://learn.microsoft.com/defender-endpoint/attack-surface-reduction-rules-reference#block-credential-stealing-from-the-windows-local-security-authority-subsystem
  - guid: be9ba2d9-53ea-4cdc-84e5-9b1eeee46550
    name: Block executable content from email client and webmail
    intune_setting: blockexecutablecontentfromemailclientandwebmail
    intune_intent: [defenderEmailContentExecutionType, defenderEmailContentExecution]
    hunting: AsrExecutableEmailContent
    quick_win: true
    source: https://learn.microsoft.com/defender-endpoint/attack-surface-reduction-rules-reference#block-executable-content-from-email-client-and-webmail
  - guid: 01443614-cd74-433a-b99e-2ecdc07bfc25
    name: Block executable files from running unless they meet a prevalence, age, or trusted list criterion
    intune_setting: blockexecutablefilesrunningunlesstheymeetprevalenceagetrustedlistcriterion
    intune_intent: [defenderUntrustedExecutableType, defenderUntrustedExecutable]
    hunting: AsrUntrustedExecutable
    source: https://learn.microsoft.com/defender-endpoint/attack-surface-reduction-rules-reference#block-executable-files-from-running-unless-they-meet-a-prevalence-age-or-trusted-list-criterion
  - guid: 5beb7efe-fd9a-4556-801d-275e5ffc04cc
    name: Block execution of potentially obfuscated scripts
    intune_setting: blockexecutionofpotentiallyobfuscatedscripts
    intune_intent: [defenderScriptObfuscatedMacroCodeType, defenderScriptObfuscatedMacroCode]
    hunting: AsrObfuscatedScript
    source: https://learn.microsoft.com/defender-endpoint/attack-surface-reduction-rules-reference#block-execution-of-potentially-obfuscated-scripts
  - guid: d3e037e1-3eb8-44c8-a917-57927947596d
    name: Block JavaScript or VBScript from launching downloaded executable content
    intune_setting: blockjavascriptorvbscriptfromlaunchingdownloadedexecutablecontent
    intune_intent: [defenderScriptDownloadedPayloadExecutionType, defenderScriptDownloadedPayloadExecution]
    hunting: AsrScriptExecutableDownload
    quick_win: true
    source: https://learn.microsoft.com/defender-endpoint/attack-surface-reduction-rules-reference#block-javascript-or-vbscript-from-launching-downloaded-executable-content
  - guid: 3b576869-a4ec-4529-8536-b80a7769e899
    name: Block Office applications from creating executable content
    intune_setting: blockofficeapplicationsfromcreatingexecutablecontent
    intune_intent: [defenderOfficeAppsExecutableContentCreationOrLaunchType, defenderOfficeAppsExecutableContentCreationOrLaunch]
    hunting: AsrExecutableOfficeContent
    source: https://learn.microsoft.com/defender-endpoint/attack-surface-reduction-rules-reference#block-office-applications-from-creating-executable-content
  - guid: 75668c1f-73b5-4cf0-bb93-3ecf5cb7cc84
    name: Block Office applications from injecting code into other processes
    intune_setting: blockofficeapplicationsfrominjectingcodeintootherprocesses
    intune_intent: [defenderOfficeAppsOtherProcessInjectionType, defenderOfficeAppsOtherProcessInjection]
    hunting: AsrOfficeProcessInjection
    source: https://learn.microsoft.com/defender-endpoint/attack-surface-reduction-rules-reference#block-office-applications-from-injecting-code-into-other-processes
  - guid: 26190899-1602-49e8-8b27-eb1d0a1ce869
    name: Block Office communication application from creating child processes
    intune_setting: blockofficecommunicationappfromcreatingchildprocesses
    intune_intent: [defenderOfficeCommunicationAppsLaunchChildProcess]
    hunting: AsrOfficeCommAppChildProcess
    source: https://learn.microsoft.com/defender-endpoint/attack-surface-reduction-rules-reference#block-office-communication-application-from-creating-child-processes
  - guid: e6db77e5-3df2-4cf1-b95a-636979351e5b
    name: Block persistence through WMI event subscription
    intune_setting: blockpersistencethroughwmieventsubscription
    intune_intent: [defenderBlockPersistenceThroughWmiType]
    hunting: AsrPersistenceThroughWmi
    standard: true
    source: https://learn.microsoft.com/defender-endpoint/attack-surface-reduction-rules-reference#block-persistence-through-wmi-event-subscription
  - guid: d1e49aac-8f56-4280-b9ba-993a6d77406c
    name: Block process creations originating from PSExec and WMI commands
    intune_setting: blockprocesscreationsfrompsexecandwmicommands
    intune_intent: [defenderProcessCreationType, defenderProcessCreation]
    hunting: AsrPsexecWmiChildProcess
    source: https://learn.microsoft.com/defender-endpoint/attack-surface-reduction-rules-reference#block-process-creations-originating-from-psexec-and-wmi-commands
  - guid: 33ddedf1-c6e0-47cb-833e-de6133960387
    name: Block rebooting machine in Safe Mode
    intune_setting: blockrebootingmachineinsafemode
    # Action types are AsrSafeModeRebootedAudited, AsrSafeModeRebootBlocked and
    # AsrSafeModeRebootWarnBypassed; the queries normalise the stem to AsrSafeModeReboot.
    hunting: AsrSafeModeReboot
    source: https://learn.microsoft.com/defender-endpoint/attack-surface-reduction-rules-reference#block-rebooting-machine-in-safe-mode
  - guid: b2b3f03d-6a65-4f7b-a9c7-1c7ef74a9ba4
    name: Block untrusted and unsigned processes that run from USB
    intune_setting: blockuntrustedunsignedprocessesthatrunfromusb
    intune_intent: [defenderUntrustedUSBProcessType, defenderUntrustedUSBProcess]
    hunting: AsrUntrustedUsbProcess
    source: https://learn.microsoft.com/defender-endpoint/attack-surface-reduction-rules-reference#block-untrusted-and-unsigned-processes-that-run-from-usb
  - guid: c0033c00-d16d-4114-a5a0-dc9b3a7d2ceb
    name: Block use of copied or impersonated system tools
    intune_setting: blockuseofcopiedorimpersonatedsystemtools
    hunting: AsrAbusedSystemTool
    source: https://learn.microsoft.com/defender-endpoint/attack-surface-reduction-rules-reference#block-use-of-copied-or-impersonated-system-tools
  - guid: a8f5898e-1dc8-49a9-9878-85004b8a61e6
    name: Block Webshell creation for Servers
    intune_setting: blockwebshellcreationforservers
    servers_only: true
    source: https://learn.microsoft.com/defender-endpoint/attack-surface-reduction-rules-reference#block-webshell-creation-for-servers
  - guid: 92e97fa1-2edf-4476-bdd6-9dd0b4dddc7b
    name: Block Win32 API calls from Office macros
    intune_setting: blockwin32apicallsfromofficemacros
    intune_intent: [defenderOfficeMacroCodeAllowWin32ImportsType, defenderOfficeMacroCodeAllowWin32Imports]
    hunting: AsrOfficeMacroWin32ApiCalls
    quick_win: true
    source: https://learn.microsoft.com/defender-endpoint/attack-surface-reduction-rules-reference#block-win32-api-calls-from-office-macros
  - guid: c1db55ab-c21a-4637-bb3f-a12568109d35
    name: Use advanced protection against ransomware
    intune_setting: useadvancedprotectionagainstransomware
    intune_intent: [defenderAdvancedRansomewareProtectionType]
    hunting: AsrRansomware
    source: https://learn.microsoft.com/defender-endpoint/attack-surface-reduction-rules-reference#use-advanced-protection-against-ransomware
