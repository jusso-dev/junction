# Current Windows client and server releases with their recent monthly security ("B", Patch Tuesday)
# cumulative updates, used by `intune.patch_age` to decide how far behind a device's OS build is.
# Optional non-security previews ("D") and out-of-band releases are left out: a device on a later
# preview already has the security fixes of the B release it follows.
#
# Source: Microsoft Windows release health (release information pages listed below). Review monthly
# after Patch Tuesday: add the new B release to each version, drop entries older than about four
# months, add new versions and set `reviewed`. The check warns when `reviewed` is more than 45 days
# old, because a stale file can make an unpatched device look current.
#
# Operators can replace this data without a release: put the same structure under
# `[packs.intune.windows_builds]` in the check configuration file.
