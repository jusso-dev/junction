anyhow.workspace = true
clap.workspace = true
junction-policy = { path = "../junction-policy" }
junction-schema = { path = "../junction-schema" }
junction-auth = { path = "../junction-auth" }
junction-runtime = { path = "../junction-runtime" }
junction-mcp = { path = "../junction-mcp" }
junction-server = { path = "../junction-server" }
