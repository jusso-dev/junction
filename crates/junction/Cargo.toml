repository.workspace = true
[dependencies]
junction-tui = { path = "../junction-tui" }
junction-generator = { path = "../junction-generator" }
junction-core = { path = "../junction-core" }
junction-registry = { path = "../junction-registry" }
junction-discovery = { path = "../junction-discovery" }
