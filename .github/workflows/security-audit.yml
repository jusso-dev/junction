name: Dependency security audit
on:
  push:
    paths: ['Cargo.lock', '**/Cargo.toml', '.github/workflows/security-audit.yml']
  pull_request:
    paths: ['Cargo.lock', '**/Cargo.toml', '.github/workflows/security-audit.yml']
  schedule:
    - cron: '41 20 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rustsec:
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LINUX || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-audit --version 0.22.2 --locked
      - run: cargo audit
